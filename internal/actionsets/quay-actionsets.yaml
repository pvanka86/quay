# =============================================================================
# Kanister ActionSet Examples — Red Hat Quay Operator
# =============================================================================
# Apply the blueprint first:
#   kubectl -n kasten-io apply -f quay-kanister-blueprint.yaml
#
# Then apply the appropriate ActionSet below.
# =============================================================================

# -----------------------------------------------------------------------------
# BACKUP ActionSet
# -----------------------------------------------------------------------------
---
apiVersion: cr.kanister.io/v1alpha1
kind: ActionSet
metadata:
  generateName: quay-backup-
  namespace: kasten-io
spec:
  actions:
  - name: backup
    blueprint: quay-operator-blueprint
    object:
      # Target the Quay source namespace
      kind: Namespace
      name: quay
      namespace: quay
    profile:
      # Reference your Kasten Location Profile (S3-compatible)
      apiVersion: v1alpha1
      kind: Profile
      name: default-profile          # replace with your profile name
      namespace: kasten-io
    options:
      # Image built from the companion Dockerfile
      quayToolsImage: "quay.io/yourorg/quay-kanister-tools:latest"
      # QuayRegistry CR name in the source namespace
      quayRegistryName: "quay-registry"

---
# -----------------------------------------------------------------------------
# RESTORE ActionSet
# Reference the backup ActionSet name in the 'from' field (see kanctl usage).
# The example below shows direct YAML; use 'kanctl create actionset --action
# restore --from <backup-actionset-name>' for convenience.
# -----------------------------------------------------------------------------
apiVersion: cr.kanister.io/v1alpha1
kind: ActionSet
metadata:
  generateName: quay-restore-
  namespace: kasten-io
spec:
  actions:
  - name: restore
    blueprint: quay-operator-blueprint
    object:
      # Target the DR namespace
      kind: Namespace
      name: quay-dr
      namespace: quay-dr
    profile:
      apiVersion: v1alpha1
      kind: Profile
      name: default-profile
      namespace: kasten-io
    # Artifacts produced by the backup ActionSet
    artifacts:
      quayBackup:
        kopiaSnapshot: "<kopiaSnapshot-value-from-backup-actionset>"
    options:
      quayToolsImage: "quay.io/yourorg/quay-kanister-tools:latest"
      quayRegistryName: "quay-registry"
      # Source namespace — used to construct correct object-store paths
      sourceNamespace: "quay"

---
# -----------------------------------------------------------------------------
# DELETE ActionSet (prune a specific backup)
# -----------------------------------------------------------------------------
apiVersion: cr.kanister.io/v1alpha1
kind: ActionSet
metadata:
  generateName: quay-delete-
  namespace: kasten-io
spec:
  actions:
  - name: delete
    blueprint: quay-operator-blueprint
    object:
      kind: Namespace
      name: quay
      namespace: quay
    profile:
      apiVersion: v1alpha1
      kind: Profile
      name: default-profile
      namespace: kasten-io
    artifacts:
      quayBackup:
        kopiaSnapshot: "<kopiaSnapshot-value-to-delete>"
    options:
      quayToolsImage: "quay.io/yourorg/quay-kanister-tools:latest"
      quayRegistryName: "quay-registry"

# =============================================================================
# kanctl convenience commands
# =============================================================================
#
# Trigger backup:
#   kanctl create actionset \
#     --action backup \
#     --namespace kasten-io \
#     --blueprint quay-operator-blueprint \
#     --namespace-target quay \
#     --profile kasten-io/default-profile \
#     --options quayToolsImage=quay.io/yourorg/quay-kanister-tools:latest \
#     --options quayRegistryName=quay-registry
#
# Trigger restore from a backup:
#   kanctl create actionset \
#     --action restore \
#     --namespace kasten-io \
#     --from quay-backup-<generated-suffix> \
#     --namespace-target quay-dr \
#     --options quayToolsImage=quay.io/yourorg/quay-kanister-tools:latest \
#     --options quayRegistryName=quay-registry \
#     --options sourceNamespace=quay
#
# Check ActionSet status:
#   kubectl -n kasten-io get actionsets -w
#   kubectl -n kasten-io describe actionset quay-backup-<suffix>
# =============================================================================
