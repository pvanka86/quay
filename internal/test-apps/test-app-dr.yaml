# =============================================================================
# Test App — DR Namespace (test-app-dr)
# Pulls busybox image from DR Quay registry
# Used to verify DR Quay is serving restored images correctly
# Set imagePullPolicy: Always to confirm fresh pull from DR registry
# Verify by checking pod events:
#   kubectl describe pod -l app=test-app-dr -n test-app-dr | grep -A5 Events
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: test-app-dr
spec: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-app-dr-pvc
  namespace: test-app-dr
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: ocs-storagecluster-ceph-rbd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app-dr-deploy
  namespace: test-app-dr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app-dr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: test-app-dr
    spec:
      containers:
      - name: test-app-dr-container
        image: quay-registry-quay-quay-dr.apps.kasten-se-lab-baremetal.kasten.veeam.local/praveen/busybox
        imagePullPolicy: Always
        command: ["/bin/sh"]
        args: ["-c", "while true; do sleep 3600; done"]
        volumeMounts:
        - mountPath: /data
          name: data
      imagePullSecrets:
      - name: quay-dr-pull-secret
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: test-app-dr-pvc
