# =============================================================================
# quay-kanister-credentials — Kanister admin credentials secret
# Blueprint: quay-kanister-blueprint v6.0.0
# =============================================================================
#
# This secret provides admin credentials to the postRestoreHook for STEP 13
# (bcrypt password reset). It must exist in BOTH the source namespace (quay)
# AND the DR namespace (quay-dr) before running backup or restore.
#
# The blueprint reads quayAdminUser and quayAdminPassword from this secret.
# If both the secret and the quayAdminPassword RestoreAction option are set,
# the option takes precedence.
#
# CREATE (replace placeholder values):
#   kubectl create secret generic quay-kanister-credentials \
#     -n quay \
#     --from-literal=quayAdminUser=<your-quay-admin-username> \
#     --from-literal=quayAdminPassword=<your-quay-admin-password>
#
#   kubectl create secret generic quay-kanister-credentials \
#     -n quay-dr \
#     --from-literal=quayAdminUser=<your-quay-admin-username> \
#     --from-literal=quayAdminPassword=<your-quay-admin-password>
#
# NOTE: Do not commit this file with real credentials.
#       Use kubectl create secret (above) instead of applying this YAML.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: quay-kanister-credentials
  namespace: quay                        # also create in quay-dr namespace
type: Opaque
stringData:
  quayAdminUser: "<your-quay-admin-username>"
  quayAdminPassword: "<your-quay-admin-password>"
