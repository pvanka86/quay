# =============================================================================
# Kanister RBAC — Red Hat Quay Operator Blueprint
# =============================================================================
# Creates a ClusterRole with all permissions needed by the blueprint phases,
# then binds it to the default service account in:
#   - quay         (source namespace — backup)
#   - quay-dr      (DR namespace — restore)
#   - openshift-storage (S3 route lookup)
#
# Apply:
#   kubectl apply -f 10_quay-kanister-rbac.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# ClusterRole — all permissions needed across all blueprint phases
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: quay-kanister-role
  labels:
    app: quay-kanister
rules:

  # QuayRegistry CR — export, patch (scale down/up, HPA disable)
  - apiGroups: ["quay.redhat.com"]
    resources: ["quayregistries"]
    verbs: ["get", "list", "patch", "update"]

  # Secrets — export config bundle, managed-secret-keys, create/patch on restore
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]

  # Pods — find postgres, redis, quay-app pods by label
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  # Pods/exec — oc exec for pg_dump, psql, redis-cli
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]

  # Pods/attach — oc rsh for psql queries
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]

  # ConfigMaps — NooBaa BUCKET_NAME lookup
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]

  # Routes — S3 endpoint lookup (openshift-storage)
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]

  # HorizontalPodAutoscalers — delete to prevent rebound scaling
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "delete"]

  # Deployments — required for Kasten to resolve Deployment template params
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

  # QuayRegistry restore — create new CR in DR namespace
  - apiGroups: ["quay.redhat.com"]
    resources: ["quayregistries"]
    verbs: ["create", "delete"]

---
# ---------------------------------------------------------------------------
# RoleBinding — source namespace (quay) — backup operations
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-kanister-binding
  namespace: quay
  labels:
    app: quay-kanister
subjects:
  - kind: ServiceAccount
    name: default
    namespace: quay
roleRef:
  kind: ClusterRole
  name: quay-kanister-role
  apiGroup: rbac.authorization.k8s.io

---
# ---------------------------------------------------------------------------
# RoleBinding — DR namespace (quay-dr) — restore operations
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-kanister-binding
  namespace: quay-dr
  labels:
    app: quay-kanister
subjects:
  - kind: ServiceAccount
    name: default
    namespace: quay
roleRef:
  kind: ClusterRole
  name: quay-kanister-role
  apiGroup: rbac.authorization.k8s.io

---
# ---------------------------------------------------------------------------
# RoleBinding — openshift-storage — S3 route lookup
# ---------------------------------------------------------------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: quay-kanister-binding
  namespace: openshift-storage
  labels:
    app: quay-kanister
subjects:
  - kind: ServiceAccount
    name: default
    namespace: quay
roleRef:
  kind: ClusterRole
  name: quay-kanister-role
  apiGroup: rbac.authorization.k8s.io
